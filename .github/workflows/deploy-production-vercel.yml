name: Deploy production (Vercel)

# Production: https://devcon.ph (Vercel). Runs when a release PR (staging -> main) or hotfix merges.
# An HQ leader must approve the `production` environment.
# vercel.json is generated by scripts/gen_vercel_json.py from docs/_headers and docs/_redirects.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  check:
    name: site-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_site.py
      - name: vercel.json is in sync with docs/_headers and docs/_redirects
        run: |
          python3 scripts/gen_vercel_json.py
          git diff --exit-code vercel.json || { echo "::error::vercel.json is out of date. Run python3 scripts/gen_vercel_json.py and commit it."; exit 1; }

  deploy:
    name: Deploy to production
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PROD_VERIFY_URL }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm install --global vercel@63.1.2
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token "$VERCEL_TOKEN"
      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Verify production
        env:
          PROD_URL: ${{ vars.PROD_VERIFY_URL }}
        run: |
          # PROD_VERIFY_URL is the project's *.vercel.app address until DNS points devcon.ph at Vercel, then https://devcon.ph
          PROD_URL="${PROD_URL%/}"
          UA="Mozilla/5.0 (DEVCON deploy check)"
          expected=$(grep -o '<meta name="version" content="[^"]*"' docs/index.html | head -1 | sed 's/.*content="//;s/"//')
          for i in $(seq 1 40); do
            v=$(curl -s -L -A "$UA" "$PROD_URL/?v=$RANDOM" | grep -o '<meta name="version" content="[^"]*"' | head -1 | sed 's/.*content="//;s/"//')
            [ "$v" = "$expected" ] && break; sleep 10
          done
          [ "$v" = "$expected" ] || { echo "::error::Production serves '$v', expected '$expected'"; exit 1; }
          fail=0
          for p in $(python3 -c "import json;print(' '.join(json.load(open('docs/url-map.json'))['pages']))"); do
            code=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' "$PROD_URL$p"); [ "$code" = "200" ] || { echo "::error::$p returned $code"; fail=1; }
          done
          [ $fail = 0 ] && echo "Production is live: $PROD_URL ($v), all pages 200."
          exit $fail
